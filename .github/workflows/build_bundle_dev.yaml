name: "Build restreamer dev images"

on:
    workflow_dispatch:
    push:
        branches:
            - "main"

permissions:
    contents: read
    packages: write

jobs:
    docker:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - ui: dev
                      core: core-dev-alpine3.23
                      ffmpeg: ffmpeg8.1.1-alpine3.23
                      platforms: linux/amd64,linux/arm64,linux/arm/v7
                      name: dev
                    - ui: dev
                      core: core-dev-alpine3.23
                      ffmpeg: ffmpeg8.1.1-rpi-alpine3.23
                      platforms: linux/arm64,linux/arm/v7
                      name: rpi-dev
                    - ui: dev
                      core: core-dev-ubuntu24.04
                      ffmpeg: ffmpeg8.1.1-vaapi-ubuntu24.04
                      platforms: linux/amd64
                      name: vaapi-dev
                    - ui: dev
                      core: core-dev-ubuntu24.04
                      ffmpeg: ffmpeg8.1.1-cuda-ubuntu24.04-cuda12.9.1
                      platforms: linux/amd64
                      name: cuda-dev
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: |
                      kingjulian2011/restreamer
                      ghcr.io/kingironman2011/restreamer
                  tags: |
                      type=raw,value=${{ matrix.name }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@master
              with:
                  platforms: all

            - name: Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@master

            - name: Login to DockerHub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Login to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build Multi-Arch
              uses: docker/build-push-action@v5
              with:
                  builder: ${{ steps.buildx.outputs.name }}
                  context: .
                  file: ./Dockerfile
                  build-args: |
                      RESTREAMER_UI_IMAGE=KingIronMan2011/restreamer-ui:${{ matrix.ui }}
                      CORE_IMAGE=datarhei/base:${{ matrix.core }}
                      FFMPEG_IMAGE=datarhei/base:${{ matrix.ffmpeg }}
                  platforms: ${{ matrix.platforms }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
